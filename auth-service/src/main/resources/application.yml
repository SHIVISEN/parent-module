server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/salon_db?createDatabaseIfNotExist=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: mySuperSecretKey12345
  expiration: 86400000 # 1 day in ms

hazelcast:
  instance-name: auth-hazelcast-instance

logging:
  level:
    root: INFO
    com.example.authservice: DEBUG
